name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Classify pull request changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          run_full=true
          reason="full validation is required"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] &&
             [[ "${HEAD_REF}" = release-please--* ]] &&
             [ -n "${BASE_SHA}" ] &&
             [ -n "${HEAD_SHA}" ]; then
            changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
            metadata_only=true

            if [ -z "${changed_files}" ]; then
              metadata_only=false
            fi

            while IFS= read -r path; do
              case "${path}" in
                .release-please-manifest.json|CHANGELOG.md|package.json) ;;
                *) metadata_only=false ;;
              esac
            done <<< "${changed_files}"

            if [ "${metadata_only}" = "true" ]; then
              if ! python3 - "${BASE_SHA}" "${HEAD_SHA}" <<'PY'
          import json
          import subprocess
          import sys

          base_sha, head_sha = sys.argv[1:]

          def read_package(revision: str) -> tuple[str, dict]:
              raw = subprocess.check_output(
                  ["git", "show", f"{revision}:package.json"],
                  text=True,
              )
              package = json.loads(raw)
              version = package.pop("version", None)
              if not isinstance(version, str):
                  raise SystemExit(1)
              return version, package

          base_version, base_package = read_package(base_sha)
          head_version, head_package = read_package(head_sha)
          if base_version == head_version or base_package != head_package:
              raise SystemExit(1)
          PY
              then
                metadata_only=false
              fi
            fi

            if [ "${metadata_only}" = "true" ]; then
              run_full=false
              reason="Release Please metadata-only pull request"
            fi
          fi

          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          {
            echo "### CI scope"
            echo
            echo "${reason}."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up pnpm
        if: steps.scope.outputs.run_full == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check out Geul event contracts sibling
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-event-contracts
          ref: main
          path: geul-event-contracts
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Move Geul event contracts to sibling path
        if: steps.scope.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sibling_path="${GITHUB_WORKSPACE}/../geul-event-contracts"
          if [ -e "${sibling_path}" ]; then
            echo "Refusing to overwrite existing sibling path: ${sibling_path}" >&2
            exit 1
          fi
          mv "${GITHUB_WORKSPACE}/geul-event-contracts" "${sibling_path}"

      - name: Install dependencies
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Geul proto dependencies
        if: steps.scope.outputs.run_full == 'true'
        working-directory: ../geul-event-contracts
        run: pnpm install --frozen-lockfile --filter @echovisionlab/geul-proto...

      - name: Lint
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm lint

      - name: Check formatting
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm format:check

      - name: Typecheck
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm typecheck

      - name: Typecheck local contracts
        if: steps.scope.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f ../geul-event-contracts/packages/proto/gen/api/content/v1/block_catalog.ts
          pnpm typecheck:local-contracts

      - name: Test local contracts
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm test:local-contracts

      - name: Dead code and exports
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm deadcode

      - name: Test coverage
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm test:coverage

      - name: Package contents smoke
        if: steps.scope.outputs.run_full == 'true'
        run: pnpm package:smoke
